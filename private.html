<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#06121d">
  <title>The Inner Observatory — Private Workspace</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/private.css">
</head>
<body>
  <a class="skip-link" href="#login-title">Skip to private access</a>
  <main class="private-shell">
    <div class="private-art" aria-hidden="true">
      <div class="orbital-diagram"><span class="orbit-one"></span><span class="orbit-two"></span><span class="orbit-three"></span><span class="orbit-core"></span></div>
    </div>
    <section class="private-form-section" aria-labelledby="login-title">
      <div class="private-heading">
        <a class="return-link" href="index.html">← RETURN TO THE OBSERVATORY</a>
        <h1 id="login-title">The Inner<br/><em>Observatory.</em></h1>
      </div>
      <div class="private-form">
        <form aria-label="Future private workspace login">
          <label for="researchID">RESEARCH ID</label>
          <input id="researchID" type="text" name="username" autocomplete="username" placeholder="Your assigned research ID" disabled>
          <label for="researchPassword">PASSPHRASE</label>
          <input id="researchPassword" type="password" name="password" autocomplete="current-password" placeholder="Your secure passphrase" disabled>
          <button type="button" disabled>ACCESS WORKSPACE <span aria-hidden="true">↗</span></button>
        </form>
        <p class="access-note"><span class="access-dot"></span> Private access is not yet active.</p>
      </div>
      <div class="private-bottom"><a href="world.html">Research Atlas ↗</a></div>
    </section>
  </main>
</body>
</html>
