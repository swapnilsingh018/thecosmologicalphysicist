# Checks every push. Publishing is done by GitHub Pages "Deploy from a branch"
# (Settings → Pages → Source: main / root), so this workflow does not deploy.
name: Check site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pages are built from content/
        run: |
          python3 tools/build.py
          git diff --exit-code -- . ':(exclude)tools' || (echo "::error::Pages are out of date. Run python3 tools/build.py and commit the result." && exit 1)
      - name: Links, metadata and sitemap
        run: node tools/check-site.mjs
      - name: Site structure
        run: for test_file in tools/test-*.mjs; do node "$test_file"; done
